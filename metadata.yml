Identifier: eos8bpb
Slug: ecoli-permeation-efflux
Status: Ready
Title: MechGate E. coli Permeation
Description: 'Scores a molecule on five Escherichia coli barriers: OmpF porin permeation,
  multi-porin permeation, lipid-route permeation, efflux susceptibility and whole-cell
  activity (MIC of 8 ug/mL or lower), from 3D conformer and charge descriptors at
  pH 7.4. Models were trained on CO-ADD screens and ChEMBL; each score carries a percentile
  against 73,154 CO-ADD compounds, with four binary calls at the authors cut-offs.
  Validated retrospectively on marketed drugs. Output depends on the SMILES string
  written, and large molecules are slow.'
